<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSCC — Voltage Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #F5F4EF; --surface: #FFFFFF; --surface-hover: #FDFCFA;
      --primary: #D97757; --primary-light: rgba(217,119,87,0.1);
      --text-1: #1B1B18; --text-2: #706F6C; --text-3: #A3A29E;
      --border: #E8E5DE; --border-light: #F0EDE7;
      --green: #1A7F4B; --green-bg: #EDFAF2;
      --red: #D64545; --red-bg: #FDF0F0;
      --amber: #B8860B; --amber-bg: #FDF6E3;
      --blue: #3572B0; --blue-bg: #EDF4FC;
      --radius: 16px; --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.02);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --input-color: #D97757; --output-color: #3572B0;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text-1); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ─── Static Header + Nav (renders before React) ─── */
    .s-header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .s-header-accent { height: 3px; background: var(--primary); }
    .s-header-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .s-header-left { display: flex; align-items: center; gap: 14px; }
    .s-header-icon { width: 38px; height: 38px; background: var(--primary-light); border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .s-header-icon svg { width: 20px; height: 20px; color: var(--primary); }
    .s-header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .s-header-sub { font-size: 12px; color: var(--text-3); font-weight: 500; margin-top: 1px; }
    .s-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; background: var(--green-bg); color: var(--green); }
    .s-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); position: relative; }
    .s-badge-dot::after { content:''; position:absolute; inset:-3px; border-radius:50%; background:var(--green); opacity:0.4; animation:pulse-ring 2s ease-out infinite; }
    @keyframes pulse-ring { 0%{transform:scale(0.8);opacity:0.5}70%{transform:scale(1.8);opacity:0}100%{transform:scale(1.8);opacity:0} }

    .s-nav { background: var(--surface); border-bottom: 1px solid var(--border-light); }
    .s-nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; gap: 0; }
    .s-nav-link { padding: 12px 20px; font-size: 13.5px; font-weight: 600; color: var(--text-3); text-decoration: none; border-bottom: 2.5px solid transparent; transition: all 0.2s ease; display: flex; align-items: center; gap: 7px; }
    .s-nav-link:hover { color: var(--text-2); }
    .s-nav-link.active { color: var(--primary); border-bottom-color: var(--primary); }
    .s-nav-link svg { width: 15px; height: 15px; }

    /* ─── Skeleton ─── */
    .skeleton { display: none; }
    .skeleton.visible { display: block; }
    .sk-container { max-width: 1100px; margin: 0 auto; padding: 24px 24px 48px; }
    @keyframes sk-shimmer { 0%{background-position:-400px 0}100%{background-position:400px 0} }
    .sk-block { background: linear-gradient(90deg, var(--border-light) 25%, var(--bg) 50%, var(--border-light) 75%); background-size: 800px 100%; animation: sk-shimmer 1.5s infinite linear; border-radius: var(--radius-sm); }
    .sk-title-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .sk-title { width:220px; height:32px; }
    .sk-tabs { width:200px; height:38px; border-radius:10px; }
    .sk-chart { height:360px; border-radius:var(--radius); margin-bottom:20px; }
    .sk-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .sk-stat { height:130px; border-radius:var(--radius); }
    .sk-range { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .sk-range-card { height:170px; border-radius:var(--radius); }

    #root.loading { display: none; }

    /* ─── Container ─── */
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 24px 48px; }
    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }

    /* ─── Page Title ─── */
    .page-title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
    .page-title { font-size:24px; font-weight:800; letter-spacing:-0.5px; }
    .page-title-sub { font-size:13px; color:var(--text-3); font-weight:500; margin-top:2px; }

    /* ─── Filter Tabs ─── */
    .filter-tabs { display:flex; gap:4px; background:var(--bg); border-radius:10px; padding:4px; border:1px solid var(--border-light); }
    .filter-tab { padding:8px 20px; font-size:13px; font-weight:600; color:var(--text-3); border:none; background:none; border-radius:7px; cursor:pointer; font-family:var(--font); transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; }
    .filter-tab:hover { color:var(--text-2); }
    .filter-tab.active { background:var(--primary); color:white; box-shadow:0 2px 6px rgba(217,119,87,0.3); }

    /* ─── Date Nav ─── */
    .date-nav { display:flex; align-items:center; justify-content:center; gap:10px; padding:16px 20px 8px; position: relative; }
    .date-arrow { width:34px; height:34px; border:1px solid var(--border); background:var(--surface); border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s ease; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .date-arrow:hover { background:var(--bg); border-color:var(--text-3); }
    .date-arrow:active { transform:scale(0.93); }
    .date-arrow svg { width:16px; height:16px; color:var(--text-2); }
    .date-label-btn { display:flex; align-items:center; gap:8px; padding:8px 16px; border:1px solid var(--border); background:var(--bg); border-radius:10px; cursor:pointer; font-family:var(--font); font-size:15px; font-weight:700; color:var(--text-1); min-width:140px; justify-content:center; transition:all 0.2s ease; -webkit-tap-highlight-color:transparent; user-select:none; }
    .date-label-btn:hover { background:var(--border-light); border-color:var(--text-3); }
    .date-label-btn:active { transform:scale(0.97); }
    .date-label-btn svg { width:16px; height:16px; color:var(--primary); flex-shrink:0; }

    /* ─── Date Popover ─── */
    .dp-overlay { position:fixed; inset:0; z-index:99; }
    .dp-popover { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-md); z-index:100; padding:16px; min-width:300px; animation:dp-enter 0.2s ease; }
    @keyframes dp-enter { from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)} }
    .dp-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .dp-nav-btn { width:30px; height:30px; border:1px solid var(--border-light); background:var(--surface); border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s ease; }
    .dp-nav-btn:hover { background:var(--bg); }
    .dp-nav-btn svg { width:14px; height:14px; color:var(--text-2); }
    .dp-month-label { font-size:14px; font-weight:700; color:var(--text-1); }

    /* Calendar grid */
    .dp-weekdays { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px; }
    .dp-wd { font-size:10.5px; font-weight:700; color:var(--text-3); text-align:center; padding:4px 0; text-transform:uppercase; letter-spacing:0.3px; }
    .dp-days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .dp-day { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--text-2); border-radius:9px; cursor:pointer; transition:all 0.15s ease; border:none; background:none; font-family:var(--font); -webkit-tap-highlight-color:transparent; }
    .dp-day:hover { background:var(--bg); color:var(--text-1); }
    .dp-day.today { border:1.5px solid var(--primary); color:var(--primary); }
    .dp-day.selected { background:var(--primary); color:white; font-weight:700; }
    .dp-day.selected:hover { background:var(--primary); opacity:0.9; }
    .dp-day.other-month { color:var(--border); pointer-events:none; }

    /* Month grid */
    .dp-months { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .dp-month-btn { padding:12px 8px; font-size:13px; font-weight:600; color:var(--text-2); border-radius:9px; cursor:pointer; transition:all 0.15s ease; border:none; background:none; font-family:var(--font); -webkit-tap-highlight-color:transparent; }
    .dp-month-btn:hover { background:var(--bg); color:var(--text-1); }
    .dp-month-btn.selected { background:var(--primary) !important; color:#FFFFFF !important; font-weight:700; }
    .dp-month-btn.current { border:1.5px solid var(--primary); color:var(--primary); }

    /* Week picker - list with date ranges */
    .dp-week-list { max-height:280px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; display:flex; flex-direction:column; gap:2px; }
    .dp-week-list::-webkit-scrollbar { width:4px; }
    .dp-week-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .dp-week-month-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); padding:10px 8px 4px; }
    .dp-week-row { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:9px; cursor:pointer; transition:all 0.15s ease; border:none; background:none; font-family:var(--font); width:100%; text-align:left; -webkit-tap-highlight-color:transparent; }
    .dp-week-row:hover { background:var(--bg); }
    .dp-week-row.selected { background:var(--primary) !important; }
    .dp-week-row .dp-wr-num { font-size:13px; font-weight:700; color:var(--text-1); }
    .dp-week-row .dp-wr-range { font-size:12px; font-weight:500; color:var(--text-3); }
    .dp-week-row.selected .dp-wr-num,
    .dp-week-row.selected .dp-wr-range { color:#FFFFFF !important; }
    .dp-week-row.current { border:1.5px solid var(--primary); }
    .dp-week-row.current .dp-wr-num { color:var(--primary); }

    /* ─── Legend ─── */
    .chart-legend { display:flex; gap:20px; padding:10px 20px 6px; flex-wrap:wrap; }
    .legend-item { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--text-2); }
    .legend-dot { width:10px; height:10px; border-radius:3px; }
    .legend-value { font-variant-numeric:tabular-nums; font-weight:700; color:var(--text-1); margin-left:2px; }

    /* ─── Chart ─── */
    .chart-wrap { position:relative; padding:8px 12px 12px; }
    .chart-canvas { display:block; width:100%; height:auto; cursor:crosshair; touch-action:none; }
    .chart-tooltip { position:absolute; pointer-events:none; background:var(--text-1); color:white; padding:10px 14px; border-radius:10px; font-size:12px; font-weight:600; box-shadow:var(--shadow-md); z-index:10; opacity:0; transition:opacity 0.15s ease; white-space:nowrap; transform:translate(-50%,-100%); margin-top:-12px; }
    .chart-tooltip.visible { opacity:1; }
    .chart-tooltip .tt-time { font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:6px; font-weight:500; }
    .chart-tooltip .tt-row { display:flex; align-items:center; gap:6px; margin-top:3px; }
    .chart-tooltip .tt-dot { width:7px; height:7px; border-radius:2px; flex-shrink:0; }
    .chart-tooltip .tt-label { color:rgba(255,255,255,0.7); }
    .chart-tooltip .tt-val { margin-left:auto; padding-left:10px; }

    /* ─── Stats ─── */
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px; }
    .stat-card { padding:20px 22px; position:relative; overflow:hidden; }
    .stat-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; border-radius:0 0 var(--radius) var(--radius); }
    .stat-icon-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .stat-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .stat-icon svg { width:18px; height:18px; }
    .stat-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-3); margin-bottom:6px; }
    .stat-value { font-size:28px; font-weight:800; letter-spacing:-1px; line-height:1; }
    .stat-unit { font-size:15px; font-weight:600; color:var(--text-3); }
    .stat-change { margin-top:8px; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:4px; }
    .stat-change--up { color:var(--green); }
    .stat-change--down { color:var(--red); }
    .stat-change--neutral { color:var(--text-3); }

    /* ─── Range ─── */
    .range-section { margin-top:20px; }
    .range-section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
    .range-section-title svg { width:14px; height:14px; opacity:0.55; }
    .range-cards { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .range-card { padding:20px; }
    .range-card-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-3); margin-bottom:16px; display:flex; align-items:center; gap:6px; }
    .range-card-title .rc-dot { width:8px; height:8px; border-radius:3px; }
    .range-bar-wrap { margin-bottom:12px; }
    .range-bar-labels { display:flex; justify-content:space-between; font-size:11px; font-weight:600; color:var(--text-3); margin-bottom:6px; }
    .range-bar { height:8px; border-radius:4px; background:var(--border-light); position:relative; overflow:hidden; }
    .range-bar-fill { height:100%; border-radius:4px; transition:width 0.5s ease; }
    .range-bar-marker { position:absolute; top:-4px; width:3px; height:16px; border-radius:2px; background:var(--text-1); transform:translateX(-50%); transition:left 0.5s ease; }
    .range-info { display:flex; justify-content:space-between; font-size:12px; margin-top:10px; }
    .range-info-item { text-align:center; }
    .range-info-label { color:var(--text-3); font-weight:500; font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; }
    .range-info-val { font-weight:700; font-size:16px; margin-top:2px; }

    /* ─── Mobile ─── */
    @media (max-width:900px) { .stats-grid{grid-template-columns:repeat(2,1fr)} .sk-stats{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:768px) {
      .s-header-inner{padding:12px 16px} .s-header-title{font-size:16px} .s-header-sub{font-size:11px}
      .s-header-icon{width:34px;height:34px;border-radius:9px} .s-header-icon svg{width:18px;height:18px}
      .s-nav-inner{padding:0 16px} .s-nav-link{padding:10px 14px;font-size:12.5px;gap:5px} .s-nav-link svg{width:13px;height:13px}
      .container{padding:18px 14px 36px} .sk-container{padding:18px 14px 36px}
      .page-title{font-size:20px} .filter-tab{padding:7px 14px;font-size:12px}
      .chart-legend{gap:14px;padding:10px 14px 6px} .legend-item{font-size:12px}
      .stats-grid{gap:10px} .stat-card{padding:16px 18px} .stat-value{font-size:24px}
      .range-cards{gap:10px} .range-card{padding:16px}
      .s-badge{font-size:11px;padding:5px 10px 5px 8px}
      .dp-popover{min-width:280px;left:50%;padding:14px}
    }
    @media (max-width:600px) {
      .stats-grid{grid-template-columns:1fr 1fr;gap:8px} .sk-stats{grid-template-columns:1fr 1fr;gap:8px}
      .stat-card{padding:14px 14px} .stat-icon{width:30px;height:30px;border-radius:8px} .stat-icon svg{width:15px;height:15px}
      .stat-value{font-size:22px} .stat-unit{font-size:13px} .stat-label{font-size:10px} .stat-change{font-size:10.5px}
      .range-cards{grid-template-columns:1fr} .sk-range{grid-template-columns:1fr}
      .page-title-row{flex-direction:column;align-items:flex-start;gap:14px}
      .filter-tabs{align-self:stretch} .filter-tab{flex:1;text-align:center;padding:8px 8px}
      .s-header-sub{display:none} .date-nav{padding:14px 14px 6px}
      .chart-legend{padding:8px 14px 4px} .chart-wrap{padding:6px 6px 8px}
      .container{padding:14px 10px 28px} .sk-container{padding:14px 10px 28px}
      .s-nav-link{padding:10px 10px;font-size:12px}
      .dp-popover{min-width:260px;padding:12px;left:50%}
      .sk-stats .sk-stat{height:110px}
    }
    @media (max-width:380px) { .s-header-icon{display:none} .s-badge span:last-child{display:none} }
  </style>
</head>
<body>
  <!-- Static Header + Nav (instant render, no React wait) -->
  <header class="s-header">
    <div class="s-header-accent"></div>
    <div class="s-header-inner">
      <div class="s-header-left">
        <div class="s-header-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
        <div><div class="s-header-title">SSCC</div><div class="s-header-sub">Smart Stabilizer Cooling Controller</div></div>
      </div>
      <div class="s-badge"><span class="s-badge-dot"></span><span>System Online</span></div>
    </div>
  </header>
  <nav class="s-nav">
    <div class="s-nav-inner">
      <a href="index.html" class="s-nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg> Dashboard</a>
      <a href="analytics.html" class="s-nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Analytics</a>
    </div>
  </nav>

  <!-- Skeleton (shown instantly, hidden when React mounts) -->
  <div class="skeleton visible" id="skeleton">
    <div class="sk-container">
      <div class="sk-title-row"><div class="sk-block sk-title"></div><div class="sk-block sk-tabs"></div></div>
      <div class="sk-block sk-chart"></div>
      <div class="sk-stats"><div class="sk-block sk-stat"></div><div class="sk-block sk-stat"></div><div class="sk-block sk-stat"></div><div class="sk-block sk-stat"></div></div>
      <div class="sk-range" style="margin-top:14px"><div class="sk-block sk-range-card"></div><div class="sk-block sk-range-card"></div></div>
    </div>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ─── Configuration ───
    const KOYEB_URL = '__KOYEB_URL__';
    const DEFAULT_RES = { day: 1, week: 5, month: 15 };
    const RES_OPTIONS = [1, 2, 5, 10, 15, 30, 60];

    // ─── Icons ───
    const ZapIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
    const LeftArrow = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const RightArrow = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const ActivityIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
    const CalIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;

    // ─── Date Popover (Web-friendly) ───
    const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WEEKDAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

    function DatePopover({ open, filter, dateRef, onSelect, onClose }) {
      const [viewYear, setViewYear] = useState(dateRef.getFullYear());
      const [viewMonth, setViewMonth] = useState(dateRef.getMonth());
      const popRef = useRef(null);

      React.useEffect(() => {
        if (open) {
          setViewYear(dateRef.getFullYear());
          setViewMonth(dateRef.getMonth());
        }
      }, [open, dateRef]);

      if (!open) return null;

      const today = new Date();

      // Day calendar
      if (filter === 'day') {
        const firstDay = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDay; i++) {
          cells.push({ day: prevMonthDays - firstDay + 1 + i, other: true });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ day: d, other: false });
        }
        const remaining = 42 - cells.length;
        for (let i = 1; i <= remaining; i++) {
          cells.push({ day: i, other: true });
        }

        const prevM = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); } else setViewMonth(viewMonth - 1); };
        const nextM = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); } else setViewMonth(viewMonth + 1); };

        return (
          <React.Fragment>
            <div className="dp-overlay" onClick={onClose}></div>
            <div className="dp-popover" ref={popRef}>
              <div className="dp-header">
                <button className="dp-nav-btn" onClick={prevM}><LeftArrow /></button>
                <span className="dp-month-label">{MONTH_NAMES[viewMonth]} {viewYear}</span>
                <button className="dp-nav-btn" onClick={nextM}><RightArrow /></button>
              </div>
              <div className="dp-weekdays">
                {WEEKDAYS.map(w => <div key={w} className="dp-wd">{w}</div>)}
              </div>
              <div className="dp-days">
                {cells.map((c, i) => {
                  const isToday = !c.other && c.day === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
                  const isSel = !c.other && c.day === dateRef.getDate() && viewMonth === dateRef.getMonth() && viewYear === dateRef.getFullYear();
                  return (
                    <button key={i}
                      className={'dp-day' + (c.other ? ' other-month' : '') + (isToday ? ' today' : '') + (isSel ? ' selected' : '')}
                      onClick={() => { if (!c.other) onSelect(new Date(viewYear, viewMonth, c.day)); }}>
                      {c.day}
                    </button>
                  );
                })}
              </div>
            </div>
          </React.Fragment>
        );
      }

      // Month picker
      if (filter === 'month') {
        return (
          <React.Fragment>
            <div className="dp-overlay" onClick={onClose}></div>
            <div className="dp-popover" ref={popRef}>
              <div className="dp-header">
                <button className="dp-nav-btn" onClick={() => setViewYear(viewYear - 1)}><LeftArrow /></button>
                <span className="dp-month-label">{viewYear}</span>
                <button className="dp-nav-btn" onClick={() => setViewYear(viewYear + 1)}><RightArrow /></button>
              </div>
              <div className="dp-months">
                {MONTH_NAMES.map((m, i) => {
                  const isCurrent = i === today.getMonth() && viewYear === today.getFullYear();
                  const isSel = i === dateRef.getMonth() && viewYear === dateRef.getFullYear();
                  return (
                    <button key={i}
                      className={'dp-month-btn' + (isCurrent ? ' current' : '') + (isSel ? ' selected' : '')}
                      onClick={() => onSelect(new Date(viewYear, i, 1))}>
                      {m}
                    </button>
                  );
                })}
              </div>
            </div>
          </React.Fragment>
        );
      }

      // Week picker - grouped by month with date ranges
      const getWeekNum = (d) => {
        const start = new Date(d.getFullYear(), 0, 1);
        return Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7);
      };
      const currentWeek = getWeekNum(dateRef);
      const todayWeek = getWeekNum(today);

      // Build weeks grouped by month
      const weekRows = useMemo(() => {
        const rows = [];
        let lastMonth = -1;
        for (let w = 1; w <= 52; w++) {
          const wStart = new Date(viewYear, 0, 1 + (w - 1) * 7);
          const wEnd = new Date(wStart); wEnd.setDate(wEnd.getDate() + 6);
          const mo = wStart.getMonth();
          if (mo !== lastMonth) {
            rows.push({ type: 'header', month: MONTH_NAMES[mo] });
            lastMonth = mo;
          }
          const startLabel = MONTH_NAMES[wStart.getMonth()] + ' ' + wStart.getDate();
          const endLabel = MONTH_NAMES[wEnd.getMonth()] + ' ' + wEnd.getDate();
          rows.push({ type: 'week', w, startLabel, endLabel, wStart });
        }
        return rows;
      }, [viewYear]);

      return (
        <React.Fragment>
          <div className="dp-overlay" onClick={onClose}></div>
          <div className="dp-popover" ref={popRef}>
            <div className="dp-header">
              <button className="dp-nav-btn" onClick={() => setViewYear(viewYear - 1)}><LeftArrow /></button>
              <span className="dp-month-label">{viewYear}</span>
              <button className="dp-nav-btn" onClick={() => setViewYear(viewYear + 1)}><RightArrow /></button>
            </div>
            <div className="dp-week-list">
              {weekRows.map((row, i) => {
                if (row.type === 'header') {
                  return <div key={'mh'+i} className="dp-week-month-label">{row.month}</div>;
                }
                const isSel = row.w === currentWeek && viewYear === dateRef.getFullYear();
                const isCurr = row.w === todayWeek && viewYear === today.getFullYear() && !isSel;
                return (
                  <button key={'w'+row.w}
                    className={'dp-week-row' + (isSel ? ' selected' : '') + (isCurr ? ' current' : '')}
                    onClick={() => onSelect(row.wStart)}>
                    <span className="dp-wr-num">Week {row.w}</span>
                    <span className="dp-wr-range">{row.startLabel} – {row.endLabel}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </React.Fragment>
      );
    }

    // ─── Demo Data ───
    function genDemoDay(dateObj) {
      const pts = [];
      const seed = dateObj.getDate() * 31 + dateObj.getMonth() * 7;
      function seededRand(i) { const x = Math.sin(seed + i * 9.2) * 10000; return x - Math.floor(x); }
      for (let m = 0; m < 1440; m += 3) {
        const hour = m / 60;
        const baseIn = 225 + 8 * Math.sin(hour * 0.26) + 4 * Math.cos(hour * 0.52);
        const baseOut = 220 + 3 * Math.sin(hour * 0.26) + 2 * Math.cos(hour * 0.52);
        pts.push({ time: m, inputV: Math.round((baseIn + (seededRand(m) - 0.5) * 10) * 10) / 10, outputV: Math.round((baseOut + (seededRand(m + 5000) - 0.5) * 4) * 10) / 10 });
      }
      return pts;
    }
    function genDemoWeek(startDate) {
      const pts = [];
      for (let d = 0; d < 7; d++) {
        const dayDate = new Date(startDate); dayDate.setDate(dayDate.getDate() + d);
        for (let h = 0; h < 24; h++) {
          const baseIn = 222 + 6 * Math.sin((d * 24 + h) * 0.15) + Math.sin(d * 3 + h * 0.7) * 4;
          const baseOut = 219 + 2 * Math.sin((d * 24 + h) * 0.15) + Math.sin(d * 2 + h * 0.5) * 2;
          const noise = (Math.sin(d * 97 + h * 37) * 10000) % 1;
          pts.push({ day: d, hour: h, label: dayDate.toLocaleDateString('en-US', { weekday: 'short' }), inputV: Math.round((baseIn + (noise - 0.5) * 6) * 10) / 10, outputV: Math.round((baseOut + (noise - 0.5) * 2.5) * 10) / 10 });
        }
      }
      return pts;
    }
    function genDemoMonth(year, month) {
      const days = new Date(year, month + 1, 0).getDate();
      const pts = [];
      for (let d = 1; d <= days; d++) {
        const baseIn = 224 + 4 * Math.sin(d * 0.4) + 2 * Math.cos(d * 0.8);
        const baseOut = 220 + 1.5 * Math.sin(d * 0.4);
        const noise = (Math.sin(d * 73 + month * 17) * 10000) % 1;
        pts.push({ day: d, inputV: Math.round((baseIn + (noise - 0.5) * 5) * 10) / 10, outputV: Math.round((baseOut + (noise - 0.5) * 2) * 10) / 10 });
      }
      return pts;
    }

    // ─── Chart Drawing ───
    function drawChart(canvas, data, mode, hoverIdx, inputColor, outputColor) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const W = rect.width, H = rect.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
      if (!data || data.length === 0) return;

      const PAD_L = 46, PAD_R = 14, PAD_T = 18, PAD_B = 34;
      const chartW = W - PAD_L - PAD_R, chartH = H - PAD_T - PAD_B;
      let allVals = data.flatMap(d => [d.inputV, d.outputV]);
      let minV = Math.floor(Math.min(...allVals) / 5) * 5;
      let maxV = Math.ceil(Math.max(...allVals) / 5) * 5;
      if (maxV - minV < 20) { minV -= 5; maxV += 5; }
      const rangeV = maxV - minV;

      function xPos(i) { return PAD_L + (i / (data.length - 1)) * chartW; }
      function yPos(v) { return PAD_T + (1 - (v - minV) / rangeV) * chartH; }

      // Grid
      ctx.strokeStyle = 'rgba(0,0,0,0.055)'; ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const v = minV + (rangeV / 5) * i; const y = yPos(v);
        ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
        ctx.fillStyle = '#A3A29E'; ctx.font = '500 10px "Plus Jakarta Sans",sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(Math.round(v) + 'V', PAD_L - 8, y + 3.5);
      }

      // X labels
      ctx.fillStyle = '#A3A29E'; ctx.textAlign = 'center';
      let xLabels = [];
      if (mode === 'day') {
        [0,120,240,360,480,600,720,840,960,1080,1200,1320,1440].forEach(m => xLabels.push({ idx: Math.round(m/3), label: String(Math.floor(m/60)).padStart(2,'0')+':00' }));
      } else if (mode === 'week') {
        for (let d = 0; d < 7; d++) { const idx = d*24+12; if (idx < data.length) xLabels.push({ idx, label: data[idx]?.label||'' }); }
      } else {
        const step = Math.max(1, Math.floor(data.length / 6));
        for (let i = 0; i < data.length; i += step) xLabels.push({ idx: i, label: String(data[i].day) });
        if (xLabels[xLabels.length-1]?.idx !== data.length-1) xLabels.push({ idx: data.length-1, label: String(data[data.length-1].day) });
      }
      xLabels.forEach(({idx, label}) => { if (idx >= 0 && idx < data.length) ctx.fillText(label, xPos(idx), H - 8); });

      function drawCurve(points, color, fillGrad) {
        if (points.length < 2) return;
        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) { const cpx = (points[i-1].x + points[i].x) / 2; ctx.bezierCurveTo(cpx, points[i-1].y, cpx, points[i].y, points[i].x, points[i].y); }
        if (fillGrad) {
          const fp = new Path2D(); fp.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) { const cpx = (points[i-1].x + points[i].x) / 2; fp.bezierCurveTo(cpx, points[i-1].y, cpx, points[i].y, points[i].x, points[i].y); }
          fp.lineTo(points[points.length-1].x, PAD_T+chartH); fp.lineTo(points[0].x, PAD_T+chartH); fp.closePath();
          ctx.save(); ctx.fillStyle = fillGrad; ctx.fill(fp); ctx.restore();
        }
        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
      }

      const step = Math.max(1, Math.floor(data.length / 400));
      const sampled = []; for (let i = 0; i < data.length; i += step) sampled.push({ ...data[i], _idx: i });
      if (sampled[sampled.length-1]._idx !== data.length-1) sampled.push({ ...data[data.length-1], _idx: data.length-1 });

      const inputPts = sampled.map(d => ({ x: xPos(d._idx), y: yPos(d.inputV) }));
      const outputPts = sampled.map(d => ({ x: xPos(d._idx), y: yPos(d.outputV) }));

      const inG = ctx.createLinearGradient(0,PAD_T,0,PAD_T+chartH); inG.addColorStop(0,inputColor+'30'); inG.addColorStop(1,inputColor+'03');
      const outG = ctx.createLinearGradient(0,PAD_T,0,PAD_T+chartH); outG.addColorStop(0,outputColor+'25'); outG.addColorStop(1,outputColor+'03');
      drawCurve(outputPts, outputColor, outG);
      drawCurve(inputPts, inputColor, inG);

      if (hoverIdx != null && hoverIdx >= 0 && hoverIdx < data.length) {
        const hx = xPos(hoverIdx);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
        ctx.beginPath(); ctx.moveTo(hx, PAD_T); ctx.lineTo(hx, PAD_T+chartH); ctx.stroke(); ctx.setLineDash([]);
        [{y:yPos(data[hoverIdx].inputV),color:inputColor},{y:yPos(data[hoverIdx].outputV),color:outputColor}].forEach(({y,color})=>{
          ctx.beginPath(); ctx.arc(hx,y,5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.stroke();
        });
      }
    }

    // ─── Chart Component ───
    function VoltageChart({ data, mode, onHover }) {
      const canvasRef = useRef(null); const wrapRef = useRef(null);
      const [hoverIdx, setHoverIdx] = useState(null);
      const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });
      const inputColor = '#D97757', outputColor = '#3572B0';

      const handleInteraction = useCallback((clientX, clientY) => {
        const canvas = canvasRef.current; if (!canvas || !data || !data.length) return;
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left - 46; const ratio = Math.max(0, Math.min(1, x / (rect.width - 60)));
        const idx = Math.round(ratio * (data.length - 1));
        setHoverIdx(idx); setTooltipPos({ x: clientX - rect.left, y: clientY - rect.top });
        if (onHover) onHover(idx);
      }, [data, onHover]);

      const clearHover = useCallback(() => { setHoverIdx(null); if (onHover) onHover(null); }, [onHover]);

      React.useEffect(() => { const c = canvasRef.current; if (c) drawChart(c, data, mode, hoverIdx, inputColor, outputColor); }, [data, mode, hoverIdx]);
      React.useEffect(() => {
        const c = canvasRef.current; if (!c) return;
        const obs = new ResizeObserver(() => drawChart(c, data, mode, hoverIdx, inputColor, outputColor));
        obs.observe(c); return () => obs.disconnect();
      }, [data, mode, hoverIdx]);

      const hoverData = hoverIdx != null && data?.[hoverIdx] ? data[hoverIdx] : null;
      let tooltipTime = '';
      if (hoverData) {
        if (mode === 'day') { const m = hoverData.time; tooltipTime = String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
        else if (mode === 'week') tooltipTime = hoverData.label + ' ' + String(hoverData.hour).padStart(2,'0')+':00';
        else tooltipTime = 'Day ' + hoverData.day;
      }

      return (
        <div className="chart-wrap" ref={wrapRef}>
          <canvas ref={canvasRef} className="chart-canvas" style={{height:280}}
            onMouseMove={e => handleInteraction(e.clientX, e.clientY)}
            onMouseLeave={clearHover}
            onTouchStart={e => { e.preventDefault(); handleInteraction(e.touches[0].clientX, e.touches[0].clientY); }}
            onTouchMove={e => { e.preventDefault(); handleInteraction(e.touches[0].clientX, e.touches[0].clientY); }}
            onTouchEnd={clearHover}></canvas>
          {hoverData && (
            <div className="chart-tooltip visible" style={{ left: Math.max(80, Math.min(tooltipPos.x, (wrapRef.current?.offsetWidth||300)-80)), top: Math.max(60, tooltipPos.y - 8) }}>
              <div className="tt-time">{tooltipTime}</div>
              <div className="tt-row"><span className="tt-dot" style={{background:inputColor}}></span><span className="tt-label">Input</span><span className="tt-val">{hoverData.inputV.toFixed(1)} V</span></div>
              <div className="tt-row"><span className="tt-dot" style={{background:outputColor}}></span><span className="tt-label">Output</span><span className="tt-val">{hoverData.outputV.toFixed(1)} V</span></div>
            </div>
          )}
        </div>
      );
    }

    // ─── Stats ───
    function calcStats(data) {
      if (!data || !data.length) return null;
      const inV = data.map(d => d.inputV), outV = data.map(d => d.outputV);
      const avg = a => a.reduce((s,v)=>s+v,0)/a.length;
      const aI = avg(inV), aO = avg(outV);
      const std = Math.sqrt(inV.reduce((s,v)=>s+(v-aI)**2,0)/inV.length);
      return {
        avgIn:aI.toFixed(1), avgOut:aO.toFixed(1),
        maxIn:Math.max(...inV).toFixed(1), minIn:Math.min(...inV).toFixed(1),
        maxOut:Math.max(...outV).toFixed(1), minOut:Math.min(...outV).toFixed(1),
        rangeIn:(Math.max(...inV)-Math.min(...inV)).toFixed(1),
        rangeOut:(Math.max(...outV)-Math.min(...outV)).toFixed(1),
        stability: Math.max(0,100-(std/aI)*300).toFixed(0),
        readings: data.length,
      };
    }

    // ─── Date formatting ───
    function fmtDate(d) { return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'); }
    function fmtWeek(d) { const e = new Date(d); e.setDate(e.getDate()+6); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+e.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
    function fmtMonth(d) { return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }

    // ─── Transform API data to chart format ───
    function apiToChartData(apiData, mode) {
      if (!apiData || !apiData.length) return [];
      return apiData.map((d, i) => {
        const ts = new Date(d.ts);
        if (mode === 'day') {
          return { time: ts.getHours() * 60 + ts.getMinutes(), inputV: d.inputV.avg, outputV: d.outputV.avg };
        } else if (mode === 'week') {
          const dayOfWeek = ts.getDay();
          return { day: dayOfWeek === 0 ? 6 : dayOfWeek - 1, hour: ts.getHours(), label: ts.toLocaleDateString('en-US', { weekday: 'short' }), inputV: d.inputV.avg, outputV: d.outputV.avg };
        } else {
          return { day: ts.getDate(), inputV: d.inputV.avg, outputV: d.outputV.avg };
        }
      });
    }

    // ─── App ───
    function App() {
      const [filter, setFilter] = useState('day');
      const [dateRef, setDateRef] = useState(new Date());
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const [pickerOpen, setPickerOpen] = useState(false);
      const [resolution, setResolution] = useState(DEFAULT_RES['day']);
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [isDemo, setIsDemo] = useState(!KOYEB_URL);

      // Hide skeleton on mount
      React.useEffect(() => {
        document.getElementById('skeleton').style.display = 'none';
      }, []);

      // Fetch data from API or use demo
      useEffect(() => {
        if (!KOYEB_URL) {
          // Demo mode — use generated data
          if (filter === 'day') setData(genDemoDay(dateRef));
          else if (filter === 'week') { const s = new Date(dateRef); s.setDate(s.getDate()-s.getDay()); setData(genDemoWeek(s)); }
          else setData(genDemoMonth(dateRef.getFullYear(), dateRef.getMonth()));
          setIsDemo(true);
          return;
        }

        // Live mode — fetch from backend
        const fetchData = async () => {
          setLoading(true);
          const dateStr = dateRef.getFullYear() + '-' + String(dateRef.getMonth()+1).padStart(2,'0') + '-' + String(dateRef.getDate()).padStart(2,'0');
          const url = `${KOYEB_URL}/analytics?range=${filter}&date=${dateStr}&resolution=${resolution}`;
          try {
            const res = await fetch(url);
            const json = await res.json();
            if (json.data && json.data.length > 0) {
              setData(apiToChartData(json.data, filter));
              setIsDemo(false);
            } else {
              // No data for this period — fall back to demo with notice
              if (filter === 'day') setData(genDemoDay(dateRef));
              else if (filter === 'week') { const s = new Date(dateRef); s.setDate(s.getDate()-s.getDay()); setData(genDemoWeek(s)); }
              else setData(genDemoMonth(dateRef.getFullYear(), dateRef.getMonth()));
              setIsDemo(true);
            }
          } catch (e) {
            console.error('Analytics fetch failed:', e);
            // Fallback to demo
            if (filter === 'day') setData(genDemoDay(dateRef));
            else if (filter === 'week') { const s = new Date(dateRef); s.setDate(s.getDate()-s.getDay()); setData(genDemoWeek(s)); }
            else setData(genDemoMonth(dateRef.getFullYear(), dateRef.getMonth()));
            setIsDemo(true);
          }
          setLoading(false);
        };
        fetchData();
      }, [filter, dateRef, resolution]);

      // Update resolution default when filter changes
      useEffect(() => {
        setResolution(DEFAULT_RES[filter] || 1);
      }, [filter]);

      const stats = useMemo(() => calcStats(data), [data]);

      const navigate = useCallback((dir) => {
        setDateRef(prev => {
          const d = new Date(prev);
          if (filter === 'day') d.setDate(d.getDate() + dir);
          else if (filter === 'week') d.setDate(d.getDate() + dir * 7);
          else d.setMonth(d.getMonth() + dir);
          return d;
        });
      }, [filter]);

      const dateLabel = filter === 'day' ? fmtDate(dateRef) : filter === 'week' ? fmtWeek(dateRef) : fmtMonth(dateRef);
      const latestIn = data.length > 0 ? data[data.length-1].inputV : 0;
      const latestOut = data.length > 0 ? data[data.length-1].outputV : 0;
      const shownIn = hoveredIdx != null && data[hoveredIdx] ? data[hoveredIdx].inputV : latestIn;
      const shownOut = hoveredIdx != null && data[hoveredIdx] ? data[hoveredIdx].outputV : latestOut;

      return (
        <div className="container">
          <div className="page-title-row">
            <div>
              <div className="page-title">Voltage Analytics</div>
              <div className="page-title-sub">Input &amp; output voltage trends over time</div>
            </div>
            <div className="filter-tabs">
              {['day','week','month'].map(f => (
                <button key={f} className={'filter-tab'+(filter===f?' active':'')} onClick={()=>{setFilter(f);setPickerOpen(false);}}>
                  {f.charAt(0).toUpperCase()+f.slice(1)}
                </button>
              ))}
            </div>
          </div>

          {isDemo && KOYEB_URL && (
            <div style={{background:'var(--amber-bg)',color:'var(--amber)',padding:'8px 16px',borderRadius:'var(--radius-sm)',fontSize:'12px',fontWeight:600,marginBottom:16,textAlign:'center'}}>
              No recorded data for this period — showing demo preview
            </div>
          )}

          <div className="card">
            <div className="date-nav">
              <button className="date-arrow" onClick={()=>navigate(-1)}><LeftArrow /></button>
              <button className="date-label-btn" onClick={()=>setPickerOpen(!pickerOpen)}>
                <CalIcon />{dateLabel}
              </button>
              <button className="date-arrow" onClick={()=>navigate(1)}><RightArrow /></button>
              <DatePopover open={pickerOpen} filter={filter} dateRef={dateRef}
                onSelect={(d)=>{setDateRef(d);setPickerOpen(false);}}
                onClose={()=>setPickerOpen(false)} />
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 20px',flexWrap:'wrap',gap:8}}>
              <div className="chart-legend" style={{padding:0}}>
              <div className="legend-item"><span className="legend-dot" style={{background:'var(--input-color)'}}></span>Input Voltage<span className="legend-value">{shownIn.toFixed(1)} V</span></div>
              <div className="legend-item"><span className="legend-dot" style={{background:'var(--output-color)'}}></span>Output Voltage<span className="legend-value">{shownOut.toFixed(1)} V</span></div>
              </div>
              {KOYEB_URL && (
                <div style={{display:'flex',alignItems:'center',gap:6,fontSize:'11px',fontWeight:600,color:'var(--text-3)'}}>
                  <span>Resolution:</span>
                  <select value={resolution} onChange={e=>setResolution(Number(e.target.value))}
                    style={{padding:'4px 8px',border:'1px solid var(--border)',borderRadius:6,background:'var(--surface)',fontSize:'11px',fontWeight:600,fontFamily:'var(--font)',color:'var(--text-2)',cursor:'pointer'}}>
                    {RES_OPTIONS.map(r => <option key={r} value={r}>{r >= 60 ? (r/60)+'h' : r+'m'}</option>)}
                  </select>
                </div>
              )}
            </div>
            <VoltageChart data={data} mode={filter} onHover={setHoveredIdx} />
          </div>

          {stats && (
            <div className="stats-grid">
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--primary-light)'}}><ZapIcon /></div></div>
                <div className="stat-label">Avg Input</div>
                <div className="stat-value">{stats.avgIn}<span className="stat-unit"> V</span></div>
                <div className="stat-change stat-change--neutral">Range: {stats.rangeIn}V</div>
              </div>
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--blue-bg)'}}><svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div></div>
                <div className="stat-label">Avg Output</div>
                <div className="stat-value">{stats.avgOut}<span className="stat-unit"> V</span></div>
                <div className="stat-change stat-change--neutral">Range: {stats.rangeOut}V</div>
              </div>
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--green-bg)'}}><svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg></div></div>
                <div className="stat-label">Peak Voltage</div>
                <div className="stat-value">{stats.maxIn}<span className="stat-unit"> V</span></div>
                <div className="stat-change stat-change--up">Highest input recorded</div>
              </div>
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--red-bg)'}}><svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg></div></div>
                <div className="stat-label">Lowest Voltage</div>
                <div className="stat-value">{stats.minIn}<span className="stat-unit"> V</span></div>
                <div className="stat-change stat-change--down">Lowest input recorded</div>
              </div>
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--green-bg)'}}><svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div></div>
                <div className="stat-label">Stability</div>
                <div className="stat-value">{stats.stability}<span className="stat-unit">%</span></div>
                <div className={'stat-change '+(Number(stats.stability)>=90?'stat-change--up':'stat-change--down')}>{Number(stats.stability)>=90?'Excellent':Number(stats.stability)>=70?'Good':'Needs attention'}</div>
              </div>
              <div className="card stat-card">
                <div className="stat-icon-row"><div className="stat-icon" style={{background:'var(--amber-bg)'}}><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg></div></div>
                <div className="stat-label">Readings</div>
                <div className="stat-value">{stats.readings.toLocaleString()}</div>
                <div className="stat-change stat-change--neutral">{resolution >= 60 ? (resolution/60)+'h' : resolution+'m'} resolution{isDemo ? ' (demo)' : ''}</div>
              </div>
            </div>
          )}

          {stats && (
            <div className="range-section" style={{marginTop:20}}>
              <div className="range-section-title"><ActivityIcon /> Voltage Range Analysis</div>
              <div className="range-cards">
                <div className="card range-card">
                  <div className="range-card-title"><span className="rc-dot" style={{background:'var(--input-color)'}}></span>Input Voltage Range</div>
                  <div className="range-bar-wrap">
                    <div className="range-bar-labels"><span>{stats.minIn}V</span><span>{stats.maxIn}V</span></div>
                    <div className="range-bar">
                      <div className="range-bar-fill" style={{background:'linear-gradient(90deg,var(--input-color)40,var(--input-color))',width:((Number(stats.avgIn)-Number(stats.minIn))/(Number(stats.maxIn)-Number(stats.minIn))*100)+'%'}}></div>
                      <div className="range-bar-marker" style={{left:((Number(stats.avgIn)-Number(stats.minIn))/(Number(stats.maxIn)-Number(stats.minIn))*100)+'%'}}></div>
                    </div>
                  </div>
                  <div className="range-info">
                    <div className="range-info-item"><div className="range-info-label">Min</div><div className="range-info-val" style={{color:'var(--red)'}}>{stats.minIn}V</div></div>
                    <div className="range-info-item"><div className="range-info-label">Average</div><div className="range-info-val">{stats.avgIn}V</div></div>
                    <div className="range-info-item"><div className="range-info-label">Max</div><div className="range-info-val" style={{color:'var(--green)'}}>{stats.maxIn}V</div></div>
                  </div>
                </div>
                <div className="card range-card">
                  <div className="range-card-title"><span className="rc-dot" style={{background:'var(--output-color)'}}></span>Output Voltage Range</div>
                  <div className="range-bar-wrap">
                    <div className="range-bar-labels"><span>{stats.minOut}V</span><span>{stats.maxOut}V</span></div>
                    <div className="range-bar">
                      <div className="range-bar-fill" style={{background:'linear-gradient(90deg,var(--output-color)40,var(--output-color))',width:((Number(stats.avgOut)-Number(stats.minOut))/(Number(stats.maxOut)-Number(stats.minOut))*100)+'%'}}></div>
                      <div className="range-bar-marker" style={{left:((Number(stats.avgOut)-Number(stats.minOut))/(Number(stats.maxOut)-Number(stats.minOut))*100)+'%'}}></div>
                    </div>
                  </div>
                  <div className="range-info">
                    <div className="range-info-item"><div className="range-info-label">Min</div><div className="range-info-val" style={{color:'var(--red)'}}>{stats.minOut}V</div></div>
                    <div className="range-info-item"><div className="range-info-label">Average</div><div className="range-info-val">{stats.avgOut}V</div></div>
                    <div className="range-info-item"><div className="range-info-label">Max</div><div className="range-info-val" style={{color:'var(--green)'}}>{stats.maxOut}V</div></div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
